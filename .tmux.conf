set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# Fix colors showing differently in TMUX
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

unbind r
bind r source-file ~/.tmux.conf
bind-key -r f run-shell "tmux new ~/.tmux-sessionizer.sh"

set -g prefix C-b
## -> Setting new leader to C + ;
# set -g prefix C-\;
# unbind C-b
## <-

set -g status-left ''

set -g base-index 1
setw -g pane-base-index 1

# bind 't' split-window -c "#{pane_current_path}"
bind 't' split-window -c "#{pane_current_path}" -l 20

bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

setw -g mode-keys vi
bind h resize-pane -L 15
bind j resize-pane -D 15
bind k resize-pane -U 15
bind l resize-pane -R 15

# Enable mouse copy/paste behavior
set -g mouse on
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

## macOS specific copy/paste settings
#set -g default-command "reattach-to-user-namespace -l $SHELL"

# Using ghosty for "tab management", and tmux for session persistence
# This lets me toggle status bar on and off
# set -g status off
bind-key b set-option status

set -g set-titles on
set -g set-titles-string '#W - #T'

set -g status-position bottom

# Simple
set -g status-style 'bg=#333333 fg=#5eacd3'

# No idea what this is tbh
# set -g status-style 'fg=#abb2bf'
# set -g status-left ' [#S] '
# set -g status-right ' '
# set -g status-right-length 50
# set -g status-left-length 50

set -g status-interval 1

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

## NOTE: Need to install tmp first, before any plugins work https://github.com/tmux-plugins/tpm
## If using https://github.com/jwtly10/.dotfiles, need to clone to dotfiles dir
## eg. `git clone https://github.com/tmux-plugins/tpm ~/.dotfiles/.tmux/plugins/tpm`

run '~/.tmux/plugins/tpm/tpm'

