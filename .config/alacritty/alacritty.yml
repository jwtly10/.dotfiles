# Alacritty configuration file

# Window settings
window:
  padding:
    x: 0
    y: 1
  decorations: full

# Font settings
font:
  size: 15.0

# Mouse bindings
mouse_bindings:
  - { button: Left, mods: Command, action: OpenLink }

# Key bindings
key_bindings:
  - { key: V,        mods: Control, action: Paste }
  - { key: Left,     mods: Option,  action: SendEsc("\x1bb") } # Send Alt-b for backward-word
  - { key: Right,    mods: Option,  action: SendEsc("\x1bf") } # Send Alt-f for forward-word
  - { key: Key3,     mods: Option,  action: SendString("#") }

# Terminal colors
colors:
  primary:
    background: '0x1C2021'

# Other settings
scrolling:
  multiplier: 1
hide_tab_bar_if_only_one_tab: true

