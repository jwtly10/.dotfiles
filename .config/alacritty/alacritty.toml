import = [
    "~/.config/alacritty/themes/themes/one_dark.toml"
]

[colors.primary]
# Gruv
# background = "#32302f"
# Sphae
# background = "#272727"
# Black
background = "#1a1a1a"

[font]
size = 22.0
normal = { family = "JetBrainsMono NF", style = "Regular" }

[keyboard]
bindings = [
  { key = "Right", mods = "Alt", chars = "\u001BF" },
  { key = "Left",  mods = "Alt", chars = "\u001BB" },
]

[env]
terminal='xterm-256color'

[scrolling]
multiplier = 1

[window]
decorations = "full"
dimensions = { columns = 120, lines = 50 }


[window.padding]
x = 0
y = 1
